# Preisliste, erfunden. Im Gewerbe-Ordner unter stammdaten/preise.yaml; pflegt nur der Mensch.
#
# Schlüssel ist das Kürzel, das in rechnung.yaml unter positionen: steht. Die AI sieht Kürzel,
# Bezeichnung und Einheit (`rechnung preisliste`), nie den Preis.
#
#   bezeichnung  wie die Position auf der Rechnung heißt; ein Text für beide Sprachen oder de/en
#   einheit      pauschal | stunde | tag | stueck | kilometer – rechnung.yaml muss dieselbe nehmen
#   preis        Einzelpreis in EUR; `resolve` übernimmt ihn, wo noch kein Preis bestätigt ist. Bei
#                anderen Währungen gilt er nicht, dann trägt der Mensch ein (`rechnung preise`)
#   art          leistung (Default), auslage oder lieferung – eine Auslage hat keinen festen Preis, ihr
#                Betrag kommt je Rechnung vom Beleg; ein `preis` an einer Auslage ist nur ein
#                Beispielbetrag für den Demo-Betrieb (RECHNUNG_DEMO), sonst bleibt er unbeachtet. Eine
#                Lieferung (Ware) kann das Werkzeug noch nicht, `resolve` bricht ab (RULES.md R39)
#   steuersatz   nur 7, als Vorschlag (§ 12 Abs. 2 UStG); ob er gilt, entscheidet das Werkzeug je Rechnung

beratung:
  bezeichnung: { de: Beratung, en: Consulting }
  einheit: stunde
  preis: 150.00

briefing:
  bezeichnung: { de: Policy-Briefing, en: Policy briefing }
  einheit: pauschal
  preis: 2400.00

panel:
  bezeichnung: { de: Teilnahme als Panelist, en: Panel participation }
  einheit: stunde
  preis: 200.00

vortrag:
  bezeichnung: { de: Vortrag, en: Talk }
  einheit: stunde
  preis: 450.00

coaching:
  bezeichnung: { de: Bewerbungscoaching, en: Application coaching }
  einheit: stunde
  preis: 90.00

reisezeit:
  bezeichnung: { de: Reisezeit, en: Travel time }
  einheit: stunde
  preis: 60.00

fahrt:
  bezeichnung: { de: Fahrtkosten, en: Mileage }
  einheit: kilometer
  preis: 0.30

nutzungsrecht:
  bezeichnung: { de: Einräumung von Nutzungsrechten an einem Text, en: Licence to use a text }
  einheit: pauschal
  preis: 300.00
  steuersatz: 7   # Rechte aus dem Urheberrechtsgesetz, § 12 Abs. 2 Nr. 7 Buchst. c UStG

# Beispiel für eine Ware: steht in der Liste, aber eine Rechnung damit bricht ab (RULES.md R39).
# Lieferungen (§ 3 Abs. 1 UStG) kann das Werkzeug noch nicht, auch nicht im Inland.
buch:
  bezeichnung: { de: Buch, en: Book }
  einheit: stueck
  preis: 24.00
  art: lieferung

# Auslagen: der Betrag kommt vom Beleg. Der Preis hier gilt nur im Demo-Betrieb, als Beispiel.
flug:
  bezeichnung: { de: Reisekosten Flug, en: "Travel: flight" }
  einheit: pauschal
  art: auslage
  preis: 280.00

bahnticket:
  bezeichnung: { de: Bahnticket, en: Train ticket }
  einheit: pauschal
  art: auslage
  preis: 89.90
